# Letakkan di host VPS: /etc/nginx/sites-available/conexa.my.id
# lalu: sudo ln -s /etc/nginx/sites-available/conexa.my.id /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d conexa.my.id     (certbot otomatis menambah HTTPS + redirect)

server {
    listen 80;
    server_name conexa.my.id;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
