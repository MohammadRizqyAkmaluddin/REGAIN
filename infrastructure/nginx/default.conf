# RE:GAIN — Nginx production (conexa.my.id)
# Sertifikat dibuat oleh Certbot di host: /etc/letsencrypt/live/conexa.my.id/

upstream regain_frontend {
    server frontend:3000;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name conexa.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name conexa.my.id;

    ssl_certificate     /etc/letsencrypt/live/conexa.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/conexa.my.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;
    root /var/www/backend/public;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Laravel API (same-origin: https://conexa.my.id/api/v1/...)
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 60s;
    }

    # Service worker & manifest: jangan di-cache lama oleh browser/proxy
    location ~ ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        proxy_pass http://regain_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Nuxt frontend (PWA)
    location / {
        proxy_pass http://regain_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
