# RE:GAIN — Nginx di dalam container (HTTP saja).
# TLS/HTTPS ditangani oleh nginx di host VPS (lihat host-conexa.conf), yang meneruskan ke 127.0.0.1:8081.

upstream regain_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;
    root /var/www/backend/public;

    # Laravel API (same-origin: https://conexa.my.id/api/v1/...)
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 60s;
    }

    # Service worker & manifest: jangan di-cache lama
    location ~ ^/(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        proxy_pass http://regain_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Nuxt frontend (PWA)
    location / {
        proxy_pass http://regain_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
